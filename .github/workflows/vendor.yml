name: govendor
on:
  pull_request:
    branches: [main]
    paths: ["theme/go.mod", "theme/go.sum"]

jobs:
  vendor:
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
          token: ${{ secrets.VENDOR_TOKEN }}

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: GPG Import
        env:
          GPG_PRIVATE_KEY: "${{ secrets.GPG_PRIVATE_KEY }}"
          GPG_PASSPHRASE: "${{ secrets.GPG_PASSPHRASE }}"
        run: nix run github:purpleclay/gpg-import

      - name: Update govendor.toml
        working-directory: theme
        run: |
          nix run github:purpleclay/go-overlay#govendor

          if git diff --quiet govendor.toml; then
            echo "No changes to govendor.toml"
            exit 0
          fi

          git add govendor.toml
          git commit --amend --no-edit --trailer "Co-authored-by: purpleclay <purpleclaygh@gmail.com>"
          git push --force-with-lease
